services:
  voice-notes:
    build: .
    container_name: voice-notes
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DB_PATH=/data/expenses.db
    volumes:
      - notes-data:/data

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config


volumes:
  notes-data:
  caddy-data:
  caddy-config: